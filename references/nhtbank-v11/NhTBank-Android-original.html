(function(){
'use strict';

const INITIAL=4056000, INIT_TX=[{id:'m1',title:'Lương tháng 10',details:'Thu nhập mẫu',value:4200000,date:'Hôm nay'},{id:'m2',title:'Siêu thị',details:'Mua sắm minh họa',value:-264000,date:'Hôm qua'},{id:'m3',title:'Bạn bè',details:'Chuyển tiền demo',value:-150000,date:'24/10'}];

const safe=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name)=>({home:'⌂',transfer:'⇄',qr:'▦',history:'◷',profile:'♙',bell:'♧',send:'↗',receive:'↙',saving:'♢',bill:'▤',card:'▣',shield:'◈',gift:'✧',store:'▥',wallet:'◉',ticket:'▱',star:'✦'})[name]||'✦';
const pages=[['home','Trang chủ'],['transfer','Giao dịch'],['qr','QR'],['history','Lịch sử'],['profile','Cá nhân']];
const motif=()=>'<div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="torus"></div><div class="bubble bubble-a"></div><div class="bubble bubble-b"></div><div class="halo"></div>';
function toast(msg){let t=$('#toast'); if(!t)return;t.textContent=msg;t.hidden=false;clearTimeout(window.ntToast);window.ntToast=setTimeout(()=>t.hidden=true,5000)}

function nav(){return pages.map(([id,name])=>`<button type="button" data-nav="${id}" class="${state.page===id?'active':''}" aria-current="${state.page===id?'page':'false'}"><span class="nav-icon ${id==='qr'?'nav-qr':''}">${icon(id)}</span><small>${name}</small></button>`).join('')}
function loginPage(){return `<div class="login-art"><div class="login-brand"><div class="mark">N<sup>✦</sup></div><strong>NhT<span>Bank</span></strong><small>TÀI CHÍNH TRONG TẦM TAY</small></div><div class="art-piece">${motif()}</div></div><section class="login-card"><div class="sandbox-chip">◆ ỨNG DỤNG MÔ PHỎNG · SANDBOX</div><h1>Chào mừng trở lại</h1><p>Không gian tài chính được thiết kế dành cho bạn.</p><form id="login-form"><label for="pin">Mã PIN dùng thử</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="Nhập 6 chữ số" required/><small class="field-note">PIN demo công khai: <b>123456</b></small><p class="error" id="login-error" aria-live="polite"></p><button type="submit" class="primary">Khám phá NhTBank <span>↗</span></button></form><p class="small-notice">Chỉ thử giao diện, không nhập thông tin ngân hàng thật.</p></section>`}
function top(){return `<div class="blue-header"><header class="app-top"><button type="button" class="wordmark" data-nav="home"><span class="mark">N<sup>✦</sup></span><strong>NhT<span>Bank</span></strong></button><div class="header-actions"><span class="sandbox-tag">SANDBOX</span><button type="button" class="bell" id="notif" aria-label="Thông báo">${icon('bell')}<i></i></button><button type="button" class="avatar" data-nav="profile" aria-label="Trang cá nhân">NT</button></div></header>${state.notification?'<div class="notification"><b>Thông báo NhTBank</b><p>Đây là ứng dụng demo, không chuyển hoặc nhận tiền thật.</p></div>':''}${state.page==='home'?`<div class="welcome"><small>XIN CHÀO, NHỰT TƯỜNG ✦</small><h1>Tài chính trong tầm tay</h1><p>Một thế giới tiện ích trong một chạm.</p></div><div class="art-piece art-home">${motif()}</div>`:`<div class="detail-title"><button data-nav="home" aria-label="Quay về">‹</button><div><h1>${pages.find(p=>p[0]===state.page)?.[1]}</h1><p>Trải nghiệm tài chính mô phỏng</p></div></div>`}</div>`}
function balanceCard(){const actions=[['Chuyển tiền','transfer','send'],['Nhận tiền','qr','receive'],['Tiết kiệm','soon','saving'],['Hóa đơn','soon','bill']];return `<section class="balance-card"><div class="card-head"><strong>TÀI KHOẢN THANH TOÁN</strong><span>›</span></div><p>NhTBank •••• 8374 <i class="live-dot"></i></p><div class="balance-value"><strong id="balance-label">${state.hidden?'••••••••':fmt(state.balance)}</strong><small>VNĐ</small><button type="button" id="toggle-balance" aria-label="${state.hidden?'Hiện':'Ẩn'} số dư">${state.hidden?'◉':'◌'}</button></div><div class="card-line"></div><div class="quick-row">${actions.map(([label,to,ic])=>`<button type="button" data-nav="${to}"><span>${icon(ic)}</span><small>${label}</small></button>`).join('')}</div></section>`}
function services(){let sv=[['Cửa hàng','store'],['Ví của tôi','wallet'],['Thẻ điện tử','card'],['Bảo vệ thẻ','shield'],['Ưu đãi','gift'],['Vé dịch vụ','ticket'],['Quà tặng','gift'],['Mục tiêu','star']];return `<section class="paper"><div class="section-title"><div><span>KHÁM PHÁ NHTBANK</span><h2>Tiện ích cho bạn</h2></div><button type="button" data-nav="soon">Tất cả ›</button></div><div class="services">${sv.map(([n,ic],i)=>`<button type="button" data-nav="soon"><span class="svc-icon hue${i%4}">${icon(ic)}</span><b>${n}</b>${i===3||i===4?'<em>MỚI</em>':''}</button>`).join('')}</div><div class="pager"><span></span><span></span></div></section>`}
function txList(l){return l.length?l.map(t=>`<div class="transaction"><div class="tx-icon ${t.value>0?'positive-bg':''}">${t.value>0?'↙':'↗'}</div><div class="tx-main"><strong>${safe(t.title)}</strong><small>${safe(t.date)} · ${safe(t.details)}</small></div><strong class="${t.value>0?'positive':''}">${t.value>0?'+':'−'}${fmt(Math.abs(t.value))} đ</strong></div>`).join(''):'<div class="empty">Không có giao dịch phù hợp.</div>'}
function historyMini(){return `<section class="paper"><div class="section-title"><div><span>DÒNG TIỀN CỦA BẠN</span><h2>Giao dịch gần đây</h2></div><button data-nav="history">Xem thêm ›</button></div>${txList(state.tx.slice(0,3))}</section>`}
function home(){return balanceCard()+services()+historyMini()}
function transfer(){const data=state.form||{name:'',account:'',amount:'',note:''};if(state.step===2)return `<section class="paper form-paper success"><div class="success-icon">✓</div><h2>Đã hoàn thành mô phỏng</h2><p>Giao dịch chỉ được cập nhật trong phiên thử nghiệm.</p><h1>−${fmt(Number(data.amount))} đ</h1><button class="primary" id="repeat">Thực hiện giao dịch demo khác</button><button class="link-button" data-nav="history">Xem lịch sử</button></section>`;if(state.step===1)return `<section class="paper form-paper"><h2>Kiểm tra thông tin</h2><p>Hãy xác nhận đây chỉ là dữ liệu minh họa.</p><div class="review"><p>Người nhận <b>${safe(data.name)}</b></p><p>Tài khoản demo <b>${safe(data.account)}</b></p><p>Số tiền <b>${fmt(Number(data.amount))} đ</b></p><p>Nội dung <b>${safe(data.note||'Chuyển tiền mô phỏng')}</b></p></div><div class="alert">◆ Thao tác này không gửi tiền thật.</div><button type="button" class="primary" id="confirm-demo">Xác nhận mô phỏng</button><button class="link-button" id="back-form">Chỉnh sửa</button></section>`;return `<section class="paper form-paper"><h2>Chuyển tiền mô phỏng</h2><p>Chỉ cập nhật dữ liệu mẫu trên thiết bị này trong phiên hiện tại.</p><form id="transfer-form"><label for="recipient">Họ tên người nhận</label><input id="recipient" value="${safe(data.name)}" maxlength="60" placeholder="Ví dụ: Nguyễn Văn A" required/><label for="account">Số tài khoản demo</label><input id="account" inputmode="numeric" value="${safe(data.account)}" maxlength="20" placeholder="0001234567" required/><label for="amount">Số tiền (VNĐ)</label><input id="amount" inputmode="numeric" value="${safe(data.amount)}" placeholder="Ví dụ: 20000" required/><p class="money-hint">Số dư mô phỏng: ${fmt(state.balance)} đ</p><label for="note">Lời nhắn (tùy chọn)</label><input id="note" value="${safe(data.note)}" maxlength="120" placeholder="Chuyển tiền minh họa"/><button class="primary" type="submit">Kiểm tra giao dịch ›</button></form></section>`}
function qr(){return `<section class="paper qr-paper"><h2>Nhận tiền bằng QR</h2><p>Đây không phải mã thanh toán VietQR.</p><div class="qr-picture"><div class="fake-qr">▦</div><strong>QR MINH HỌA</strong><small>KHÔNG QUÉT THANH TOÁN</small></div><h3>Nguyễn Nhựt Tường</h3><p>Tài khoản demo: <b>0788818374</b></p><div class="alert">◆ QR minh họa, không có chức năng nhận tiền. Không chia sẻ như mã thanh toán thật.</div></section>`}
function history(){const filtered=state.tx.filter(t=>state.filter==='all'||(state.filter==='in'?t.value>0:t.value<0));return `<section class="paper history-paper"><div class="section-title"><div><span>GIAO DỊCH MẪU</span><h2>Lịch sử mô phỏng</h2></div></div><div class="filters">${[['all','Tất cả'],['in','Tiền vào'],['out','Tiền ra']].map(([k,n])=>`<button type="button" data-filter="${k}" class="${state.filter===k?'active':''}">${n}</button>`).join('')}</div>${txList(filtered)}</section>`}
function profile(){return `<section class="paper profile-paper"><div class="cover"></div><div class="big-avatar">NT</div><h2>Nguyễn Nhựt Tường</h2><p>Thành viên NhTBank · Sandbox</p><div class="rows"><div><span>Chủ tài khoản</span><b>Nguyễn Nhựt Tường</b></div><div><span>Số tài khoản mẫu</span><b>0788818374</b></div><div><span>Số dư mô phỏng</span><b>${fmt(state.balance)} đ</b></div><div><span>Hình thức lưu</span><b>Trong phiên hiện tại</b></div></div><button class="primary" id="logout">Đăng xuất & đặt lại dữ liệu</button></section>`}
function app(){return `<aside class="sidebar"><div class="sidebar-brand"><div class="mark">N<sup>✦</sup></div><strong>NhTBank</strong></div><span class="sidebar-caption">KHÔNG GIAN CỦA BẠN</span>${pages.map(([id,n])=>`<button data-nav="${id}" class="${state.page===id?'active':''}"><span>${icon(id)}</span>${n}</button>`).join('')}<p>◆ Môi trường Sandbox</p></aside><div class="workspace">${top()}<main class="content ${state.page==='home'?'':'detail-content'}">${({home,transfer,qr,history,profile})[state.page]()}<p class="footer-warning">◆ NhTBank Sandbox — Không giao dịch hoặc nhận tiền thật.</p></main></div><nav class="mobile-nav" aria-label="Điều hướng chính">${nav()}</nav>`}
function render(){document.body.classList.toggle('has-login',!state.logged);$('#app').innerHTML=state.logged?app():loginPage(); bind();}
function bind(){document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{const dest=btn.dataset.nav;if(dest==='soon')toast('Đây là chức năng giới thiệu, chưa xử lý dịch vụ.');else setPage(dest)}));$('#login-form')?.addEventListener('submit',e=>{e.preventDefault();if($('#pin').value==='123456'){state.logged=true;render()}else $('#login-error').textContent='PIN demo là 123456';});$('#toggle-balance')?.addEventListener('click',()=>{state.hidden=!state.hidden;render()});$('#notif')?.addEventListener('click',()=>{state.notification=!state.notification;render()});$('#logout')?.addEventListener('click',()=>{state.logged=false;state.page='home';state.balance=INITIAL;state.tx=INIT_TX.map(t=>({...t}));state.hidden=true;state.form=undefined;state.step=0;render()});document.querySelectorAll('[data-filter]').forEach(x=>x.addEventListener('click',()=>{state.filter=x.dataset.filter;render()}));$('#transfer-form')?.addEventListener('submit',e=>{e.preventDefault();const data={name:$('#recipient').value.trim(),account:$('#account').value.trim(),amount:$('#amount').value.trim(),note:$('#note').value.trim()};const n=Number(data.amount);if(data.name.length<2||!/^[0-9]{6,20}$/.test(data.account)||!/^[0-9]+$/.test(data.amount)||!Number.isSafeInteger(n)||n<1000||n>state.balance){toast('Kiểm tra tên, tài khoản demo 6–20 chữ số và số tiền hợp lệ (tối thiểu 1.000 đ).');return}state.form=data;state.step=1;render()});$('#back-form')?.addEventListener('click',()=>{state.step=0;render()});$('#confirm-demo')?.addEventListener('click',()=>{if(state.step!==1||state.busy)return;state.busy=true;const d=state.form;let n=Number(d.amount);if(!Number.isSafeInteger(n)||n<1000||n>state.balance){state.busy=false;toast('Số tiền không hợp lệ.');return}state.balance-=n;state.tx.unshift({id:'demo-'+Date.now(),title:d.name,details:d.note||'Chuyển tiền mô phỏng',value:-n,date:'Vừa xong'});state.step=2;state.busy=false;render()});$('#repeat')?.addEventListener('click',()=>{state.form=undefined;state.step=0;render()});}
render();
})();
</script></body></html>
