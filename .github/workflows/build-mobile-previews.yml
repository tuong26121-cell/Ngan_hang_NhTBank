name: NhTBank mobile previews (Android and iOS)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/nhtbank-mobile-ios-2026-10
    paths:
      - 'frontend/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-mobile-previews.yml'
jobs:
  android-apk:
    name: Android debug APK (sandbox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build website
        run: |
          npm ci
          npm run build
      - name: Add Android shell
        run: |
          npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NhTBank-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios-simulator:
    name: iOS Simulator app (not IPA)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build website
        run: |
          npm ci
          npm run build
      - name: Add iOS shell
        run: |
          npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          npx cap add ios
          npx cap sync ios
      - name: Compile iOS Simulator app without signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO build
          test -d build-ios/Build/Products/Debug-iphonesimulator/App.app
          cd build-ios/Build/Products/Debug-iphonesimulator
          zip -q -r "$GITHUB_WORKSPACE/NhTBank-iOS-Simulator-App.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: NhTBank-iOS-Simulator-App
          path: NhTBank-iOS-Simulator-App.zip
          if-no-files-found: error
