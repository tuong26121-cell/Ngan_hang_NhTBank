name: Deploy NhTBank to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Install dependencies
        run: npm ci
      - name: Test application
        run: npm test
      - name: Build React application for the Pages path
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
      - name: Keep the deployment static
        run: touch dist/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          # Preserve the static-site marker created above.
          include-hidden-files: true

  deploy:
    # APK-only merges may build without deploying the public website.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[khong-trien-khai-web]')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
