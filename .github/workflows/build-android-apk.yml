name: Xây dựng APK Android NhTBank thử nghiệm
on:
  workflow_dispatch:
  push:
    branches:
      - 'xay-dung/apk-android-thu-nghiem'
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
concurrency:
  group: nhtbank-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build Vite web assets
        run: npm run build
      - name: Prepare isolated Capacitor Android project
        run: |
          npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "vn.nhtbank.demo",
            "appName": "NhTBank Demo",
            "webDir": "dist",
            "server": {"androidScheme": "https"}
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK and checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/NhTBank-Debug.apk
          (cd apk-output && sha256sum NhTBank-Debug.apk > SHA256SUMS.txt)
          cat apk-output/SHA256SUMS.txt
      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: NhTBank-Android-Debug-${{ github.sha }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 7
