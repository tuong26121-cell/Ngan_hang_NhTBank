name: Check button interactions
on:
  pull_request:
    branches: ["NhTBank"]
permissions:
  contents: read
jobs:
  interactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base /Ngan_hang_NhTBank/
      - run: npx playwright install --with-deps chromium
      - name: Test production build at Pages subpath
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /Ngan_hang_NhTBank/ &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/Ngan_hang_NhTBank/ >/dev/null; then break; fi
            sleep 1
          done
          NHT_TEST_URL=http://127.0.0.1:4173/Ngan_hang_NhTBank/ npm run test:e2e -- --max-failures=1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: button-interaction-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
