name: Doi ten tai lieu de hieu
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/doi-ten-tai-lieu-main-20261107.yml
permissions:
  contents: write
jobs:
  doi-ten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Doi ten va cap nhat lien ket
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import json, pathlib, subprocess
          mapping = json.loads("{\"docs/architecture.md\":\"docs/kien-truc-he-thong.md\",\"docs/backend-supabase-architecture-plan.md\":\"docs/ke-hoach-kien-truc-backend-supabase.md\",\"docs/button-investigation-2026-10-30.md\":\"docs/dieu-tra-loi-nut-bam-2026-10-30.md\",\"docs/ios-ipa-build.md\":\"docs/huong-dan-xay-dung-ipa-ios.md\",\"docs/ios-signed-ipa.md\":\"docs/huong-dan-ky-ipa-ios.md\",\"docs/mb-bank-sepay-integration.md\":\"docs/ke-hoach-tich-hop-mb-bank-sepay.md\",\"docs/mobile-preview.md\":\"docs/xem-truoc-tren-dien-thoai.md\",\"docs/security-update.md\":\"docs/cap-nhat-bao-mat.md\",\"docs/ui-acceptance.md\":\"docs/nghiem-thu-giao-dien.md\",\"docs/ui-standard.md\":\"docs/tieu-chuan-giao-dien.md\",\"docs/validation.md\":\"docs/kiem-chung-chuc-nang.md\",\"docs/vietqr-studio.md\":\"docs/thiet-ke-vietqr.md\",\"docs/dieu-phoi/ARCHITECTURE.md\":\"docs/dieu-phoi/kien-truc-dieu-phoi.md\",\"docs/dieu-phoi/DECISIONS.md\":\"docs/dieu-phoi/quyet-dinh-du-an.md\",\"docs/dieu-phoi/HANDOFF-LOG.md\":\"docs/dieu-phoi/nhat-ky-ban-giao.md\",\"docs/dieu-phoi/MASTER-STATUS.md\":\"docs/dieu-phoi/tong-quan-trang-thai.md\",\"docs/dieu-phoi/ROADMAP.md\":\"docs/dieu-phoi/lo-trinh-phat-trien.md\",\"docs/dieu-phoi/dot-1/03-design-system.md\":\"docs/dieu-phoi/dot-1/03-he-thiet-ke.md\",\"docs/dieu-phoi/dot-1/08-transfer-idempotency.md\":\"docs/dieu-phoi/dot-1/08-chong-trung-chuyen-tien.md\",\"docs/dieu-phoi/dot-1/10-nghiep-vu-mvp.md\":\"docs/dieu-phoi/dot-1/10-nghiep-vu-phien-ban-dau.md\",\"docs/dieu-phoi/dot-1/13-qa-test-matrix.md\":\"docs/dieu-phoi/dot-1/13-ma-tran-kiem-thu.md\",\"docs/dieu-phoi/dot-1/14-ci-inventory.md\":\"docs/dieu-phoi/dot-1/14-kiem-ke-quy-trinh-kiem-thu.md\",\"docs/dieu-phoi/dot-2b/ops-01.md\":\"docs/dieu-phoi/dot-2b/van-hanh-01.md\",\"docs/dieu-phoi/dot-2c/09-sepay-webhook.md\":\"docs/dieu-phoi/dot-2c/09-tiep-nhan-thong-bao-sepay.md\",\"docs/dieu-phoi/dot-2c/contract-sepay-admin-ai.md\":\"docs/dieu-phoi/dot-2c/hop-dong-sepay-quan-tri-ai.md\",\"docs/security/BACKEND_WEBHOOK_TEST_PLAN.md\":\"docs/security/ke-hoach-kiem-thu-thong-bao-backend.md\",\"docs/sql-drafts/SECURITY_REVIEW_v3.md\":\"docs/sql-drafts/danh-gia-bao-mat-phien-ban-3.md\",\"docs/sql-drafts/testing/TEST_MATRIX.md\":\"docs/sql-drafts/testing/ma-tran-kiem-thu.md\"}")
          root = pathlib.Path(".")
          for old, new in mapping.items():
              source, target = root / old, root / new
              assert source.is_file() and not target.exists(), (old, new)
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", old, new], check=True)
          names = {pathlib.PurePosixPath(old).name: pathlib.PurePosixPath(new).name for old, new in mapping.items()}
          assert len(names) == len(mapping)
          paths = subprocess.check_output(["git", "ls-files", "--cached", "--others", "--exclude-standard", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode())
              if not path.is_file() or path.as_posix() == ".github/workflows/doi-ten-tai-lieu-main-20261107.yml":
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeError, OSError):
                  continue
              revised = original
              for old, new in mapping.items():
                  revised = revised.replace(old, new)
              for old, new in names.items():
                  revised = revised.replace(old, new)
              if revised != original:
                  path.write_text(revised, encoding="utf-8")
          index = pathlib.Path("docs/README.md")
          assert not index.exists()
          lines = ["# Danh muc tai lieu NhTBank", "", "Ten tep dung tieng Viet khong dau de de tim va chia se. README.md va AGENTS.md giu ten quy uoc cua GitHub.", "", "## Tai lieu chinh", ""]
          for old, new in mapping.items():
              lines.append(f"- [{pathlib.PurePosixPath(new).stem.replace('-', ' ').capitalize()}]({new.removeprefix('docs/')})")
          index.write_text("\n".join(lines) + "\n", encoding="utf-8")
          subprocess.run(["git", "add", "-A"], check=True)
          result = subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          subprocess.run(["git", "commit", "-m", "docs: dat ten tai lieu tieng Viet khong dau va cap nhat lien ket [khong-trien-khai-web]"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          PY
