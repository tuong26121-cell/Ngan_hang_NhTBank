name: Verify NhTBank transaction platform
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/transaction-platform-20261029, codex/resilient-transfers-v2-20261029]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:platform
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhtbank-platform-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
